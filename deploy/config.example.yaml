runtime:
  nodeEnv: production

server:
  port: 3001
  corsOrigin: ""

branding:
  title: nyabase
  description: 开发容器管理平台

auth:
  # Required in production. Generate with:
  #   openssl rand -hex 32
  jwtSecret: ""
  jwtExpiresIn: 15m
  refreshTokenExpiresDays: 7
  # Leave empty to generate a one-time password on first production boot.
  adminInitPassword: ""

database:
  driver: sqlite
  path: /data/nyabase.db
  synchronize: false
  migrationsRun: true

metrics:
  victoriaMetricsUrl: http://victoriametrics:8428

http:
  # Required. Generate independently with: openssl rand -hex 32
  proxyToken: ""

ssh:
  keyEncryptionSecret: ""
  # Required. Generate independently with: openssl rand -hex 32
  proxyToken: ""
  proxyPublicHost: ""
  proxyPublicPort: 2222
  proxySnapshotStaleMs: 300000
