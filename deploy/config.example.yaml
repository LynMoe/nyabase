runtime:
  nodeEnv: production
  # Run the HTTP control plane and the Incus reconciliation worker together.
  role: all

incus:
  # Fixed simplestreams image alias used by server preflight probes.
  preflightImageAlias: ""
  # Optional immutable image fingerprint when an alias is not used.
  preflightImageFingerprint: ""
  # Fixed HTTPS URL checked from the preflight instance.
  preflightEgressUrl: ""
  preflightSourceServer: https://images.linuxcontainers.org
  # Dedicated simplestreams source for managed image assignment. Empty uses preflightSourceServer.
  imageSourceServer: https://nyabase-images.nyabase-lxc-images.workers.dev
  # Docker Compose injects these PEM files as read-only secrets. The CA file
  # may contain the self-signed Incus server certificate.
  clientCertificateFile: /run/secrets/incus_client_cert
  clientPrivateKeyFile: /run/secrets/incus_client_key
  caFile: /run/secrets/incus_ca
  requestTimeoutMs: 10000
  operationWaitTimeoutMs: 120000

server:
  port: 3001
  corsOrigin: ""

branding:
  title: nyabase
  description: Incus system-container management platform

auth:
  # Required in production (>= 32 chars). Empty fails closed. Generate with:
  #   openssl rand -hex 32
  jwtSecret: ""
  jwtExpiresIn: 15m
  refreshTokenExpiresDays: 7
  # Leave empty to generate a one-time password on first production boot.
  adminInitPassword: ""

database:
  # DATABASE_URL takes precedence in the Compose deployment. URL-encode
  # reserved characters in the password.
  url: "postgresql://nyabase:CHANGE_ME@postgres:5432/nyabase"
  poolMax: 20
  idleTimeoutMs: 30000
  statementTimeoutMs: 15000
  migrationsRun: true

redis:
  # PostgreSQL remains canonical. Redis is disposable acceleration and wake
  # state; use rediss:// with a managed endpoint outside this example.
  # REDIS_URL takes precedence in the Compose deployment.
  url: "redis://nyabase:CHANGE_ME@redis:6379/0"
  keyPrefix: "nyabase:"
  # Mount this PEM bundle read-only into the Backend container when a private
  # CA signs the rediss:// endpoint. Leave both values empty for local Compose.
  tlsCaFile: ""
  tlsServername: ""

metrics:
  # Reads go directly to VictoriaMetrics; writes go through vmagent so its
  # bounded on-disk queue can absorb a VictoriaMetrics outage.
  victoriaMetricsUrl: http://victoriametrics:8428
  vmagentUrl: http://vmagent:8429

http:
  # Required. Empty fails closed. Generate independently with:
  #   openssl rand -hex 32
  proxyToken: ""

ssh:
  # Required in production. Empty fails closed. Generate independently with:
  #   openssl rand -hex 32
  # Must not reuse auth.jwtSecret.
  keyEncryptionSecret: ""
  # Required. Empty fails closed. Generate independently with:
  #   openssl rand -hex 32
  proxyToken: ""
  proxyPublicHost: ""
  proxyPublicPort: 2222
  proxySnapshotStaleMs: 300000
