runtime:
  nodeEnv: production

incus:
  # Nyabase workload alias from nyabase-images (baked Ubuntu, not vanilla LXC).
  preflightImageAlias: "ubuntu/24.04"
  # Required in production: combined squashfs fingerprint of the baked image.
  # Empty fingerprint is not allowed before opening container create.
  preflightImageFingerprint: ""
  # Fixed HTTPS URL checked from the preflight instance.
  preflightEgressUrl: ""
  preflightSourceServer: https://nyabase-images.nyabase-lxc-images.workers.dev
  # Dedicated simplestreams source for managed image assignment. Empty uses preflightSourceServer.
  imageSourceServer: https://nyabase-images.nyabase-lxc-images.workers.dev
  # The Backend never dials Incus: each server's nyabase-agent connects to the
  # Backend (wss://<backend>/ws/agent) and carries every Incus call over that link.
  requestTimeoutMs: 10000
  operationWaitTimeoutMs: 120000

server:
  port: 3001
  # Browser sign-in requires the SPA and API on the same site (the bundled
  # frontend already is). corsOrigin only serves non-cookie API clients.
  corsOrigin: ""
  # Reverse proxy addresses/CIDRs whose X-Forwarded-For is trusted, e.g.
  # "loopback" for a same-host proxy. Empty uses the TCP peer address.
  trustedProxies: ""
  # error | warn | log | debug | verbose
  logLevel: log

branding:
  title: nyabase
  description: Incus system-container management platform

auth:
  # Required in production (>= 32 chars). Empty fails closed. Generate with:
  #   openssl rand -hex 32
  jwtSecret: ""
  jwtExpiresIn: 15m
  # Idle timeout: each refresh extends the session by this many days...
  refreshTokenExpiresDays: 7
  # ...but never past this many days after login.
  sessionMaxLifetimeDays: 30
  # The refresh session is an HttpOnly, SameSite=Strict cookie scoped to
  # /api/auth. Keep Secure on; disable only for plain-HTTP development on a
  # host other than localhost.
  cookieSecure: true
  # Leave empty to generate a one-time password on first production boot.
  adminInitPassword: ""

database:
  # DATABASE_URL takes precedence in the Compose deployment. URL-encode
  # reserved characters in the password.
  url: "postgresql://nyabase:CHANGE_ME@postgres:5432/nyabase"
  poolMax: 20
  idleTimeoutMs: 30000
  statementTimeoutMs: 15000
  migrationsRun: true

metrics:
  # Backend writes samples to and queries VictoriaMetrics directly. Unsent
  # samples wait in a bounded in-memory queue and are dropped when it overflows.
  victoriaMetricsUrl: http://victoriametrics:8428

http:
  # Required. Empty fails closed. Generate independently with:
  #   openssl rand -hex 32
  proxyToken: ""

ssh:
  # Required in production. Empty fails closed. Generate independently with:
  #   openssl rand -hex 32
  # Must not reuse auth.jwtSecret.
  keyEncryptionSecret: ""
  # Required. Empty fails closed. Generate independently with:
  #   openssl rand -hex 32
  proxyToken: ""
  proxyPublicHost: ""
  proxyPublicPort: 2222
  # Containers are reached as <name>.<suffix> (e.g. `ssh root@work.nya`).
  proxyHostSuffix: nya
  proxySnapshotStaleMs: 300000
  # Days of SSH connection history kept in detail (older is folded per day).
  proxyHistoryRetentionDays: 90
