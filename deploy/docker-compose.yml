name: nyabase

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_signal: SIGTERM
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      # The cluster superuser is for operators only (backups, restores,
      # upgrades). The Backend connects as `nyabase`, a non-superuser that owns
      # only the `nyabase` database; postgres-app-role.sh creates both on the
      # first start of an empty volume.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      NYABASE_DB_PASSWORD: ${NYABASE_DB_PASSWORD:?set NYABASE_DB_PASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # PostgreSQL 18 stores its version-specific PGDATA below this mount.
      - postgres-data:/var/lib/postgresql
      - ./postgres-app-role.sh:/docker-entrypoint-initdb.d/10-nyabase-app-role.sh:ro
    cpus: ${POSTGRES_CPUS:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-4g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-512}
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    networks:
      - control-plane
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 1m

  victoriametrics:
    <<: *service-defaults
    image: victoriametrics/victoria-metrics:v1.148.0@sha256:407013e902f9a0ba1d4b2d4c077c47bbaf917c893c52ff39b19efe83a654afda
    # No host port: its HTTP API, admin endpoints (delete series, snapshots)
    # included, is unauthenticated, so only the Backend reaches it over the
    # internal telemetry network (see OPERATIONS.md for operator access).
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VM_RETENTION_PERIOD:-30d}
      - -storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK_SPACE_BYTES:-5GiB}
    # The image runs as root and vm-data belongs to root; without capabilities
    # that root can write only what it owns (the data volume).
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: ${VICTORIAMETRICS_CPUS:-2.0}
    mem_limit: ${VICTORIAMETRICS_MEMORY_LIMIT:-4g}
    pids_limit: ${VICTORIAMETRICS_PIDS_LIMIT:-512}
    networks:
      - telemetry
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:8428/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 1m

  backend:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      # Loopback only: a TLS-terminating reverse proxy on this host is the
      # public entrypoint for the panel, /api and /ws/* (see OPERATIONS.md).
      - "127.0.0.1:3001:3001"
    environment:
      NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
      # Inside the container; the host publish below stays loopback-only.
      LISTEN_ADDRESS: 0.0.0.0
      # Docker forwards the loopback publish from the edge bridge's own
      # address (the first one of EDGE_SUBNET), so that is the reverse proxy's
      # address as the Backend sees it.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.250.1}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      PG_APPLICATION_NAME: ${PG_APPLICATION_NAME:-nyabase-backend}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      PG_LOCK_TIMEOUT_MS: ${PG_LOCK_TIMEOUT_MS:-5000}
      PG_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${PG_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
      PG_READINESS_TIMEOUT_MS: ${PG_READINESS_TIMEOUT_MS:-5000}
      PG_SSL_MODE: ${PG_SSL_MODE:-disable}
      PG_SSL_CA_FILE: ${PG_SSL_CA_FILE:-}
      PG_SSL_SERVERNAME: ${PG_SSL_SERVERNAME:-}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      INCUS_PREFLIGHT_IMAGE_ALIAS: ${INCUS_PREFLIGHT_IMAGE_ALIAS:-}
      INCUS_PREFLIGHT_IMAGE_FINGERPRINT: ${INCUS_PREFLIGHT_IMAGE_FINGERPRINT:-}
      INCUS_PREFLIGHT_EGRESS_URL: ${INCUS_PREFLIGHT_EGRESS_URL:-}
      # Empty leaves these online-editable in the system settings page.
      INCUS_PREFLIGHT_SOURCE_SERVER: ${INCUS_PREFLIGHT_SOURCE_SERVER:-}
      INCUS_REQUEST_TIMEOUT_MS: ${INCUS_REQUEST_TIMEOUT_MS:-}
      INCUS_OPERATION_WAIT_TIMEOUT_MS: ${INCUS_OPERATION_WAIT_TIMEOUT_MS:-}
      VICTORIA_METRICS_URL: http://victoriametrics:8428
    volumes:
      # Copy config.example.yaml to config.yaml and set production secrets first.
      # Compose cannot chmod a host bind-mount; set host mode 0400 (see OPERATIONS.md).
      - ./config.yaml:/etc/nyabase/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=1770,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: ${BACKEND_CPUS:-2.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-512}
    networks:
      - edge
      - control-plane
      - telemetry
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health/ready')
          .then((response) => {
            if (!response.ok) process.exit(1);
          })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 1m

networks:
  edge:
    ipam:
      config:
        # Pinned so TRUSTED_PROXIES survives network recreation; change
        # EDGE_SUBNET and TRUSTED_PROXIES together if it collides.
        - subnet: ${EDGE_SUBNET:-172.30.250.0/24}
  control-plane:
    internal: true
  telemetry:
    internal: true

volumes:
  postgres-data:
  vm-data:

