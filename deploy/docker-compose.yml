services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: nyabase-vm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - "--retentionPeriod=12"
      - "--storageDataPath=/victoria-metrics-data"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: nyabase-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
    volumes:
      - backend-data:/data
      # Copy deploy/config.example.yaml to deploy/config.yaml and set production secrets first.
      - ./config.yaml:/etc/nyabase/config.yaml:ro
    depends_on:
      - victoriametrics

volumes:
  vm-data:
  backend-data:
