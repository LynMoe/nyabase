name: nyabase

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_signal: SIGTERM
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyabase}
      POSTGRES_USER: ${POSTGRES_USER:-nyabase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # PostgreSQL 18 stores its version-specific PGDATA below this mount.
      - postgres-data:/var/lib/postgresql
    cpus: ${POSTGRES_CPUS:-4.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-4g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-512}
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    networks:
      - control-plane
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 1m

  victoriametrics:
    <<: *service-defaults
    image: victoriametrics/victoria-metrics:v1.148.0@sha256:407013e902f9a0ba1d4b2d4c077c47bbaf917c893c52ff39b19efe83a654afda
    ports:
      # Keep the existing loopback-only operational endpoint.
      - "127.0.0.1:8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VM_RETENTION_PERIOD:-30d}
      - -storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK_SPACE_BYTES:-5GiB}
    cpus: ${VICTORIAMETRICS_CPUS:-4.0}
    mem_limit: ${VICTORIAMETRICS_MEMORY_LIMIT:-4g}
    pids_limit: ${VICTORIAMETRICS_PIDS_LIMIT:-512}
    networks:
      - telemetry
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:8428/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 1m

  backend:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      # Public control-plane HTTP and WebSocket entrypoint.
      - "3001:3001"
    environment:
      NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      PG_APPLICATION_NAME: ${PG_APPLICATION_NAME:-nyabase-backend}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      PG_LOCK_TIMEOUT_MS: ${PG_LOCK_TIMEOUT_MS:-5000}
      PG_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${PG_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
      PG_READINESS_TIMEOUT_MS: ${PG_READINESS_TIMEOUT_MS:-5000}
      PG_SSL_MODE: ${PG_SSL_MODE:-disable}
      PG_SSL_CA_FILE: ${PG_SSL_CA_FILE:-}
      PG_SSL_SERVERNAME: ${PG_SSL_SERVERNAME:-}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      INCUS_PREFLIGHT_IMAGE_ALIAS: ${INCUS_PREFLIGHT_IMAGE_ALIAS:-}
      INCUS_PREFLIGHT_IMAGE_FINGERPRINT: ${INCUS_PREFLIGHT_IMAGE_FINGERPRINT:-}
      INCUS_PREFLIGHT_EGRESS_URL: ${INCUS_PREFLIGHT_EGRESS_URL:-}
      INCUS_PREFLIGHT_SOURCE_SERVER: ${INCUS_PREFLIGHT_SOURCE_SERVER:-https://nyabase-images.nyabase-lxc-images.workers.dev}
      INCUS_REQUEST_TIMEOUT_MS: ${INCUS_REQUEST_TIMEOUT_MS:-10000}
      INCUS_OPERATION_WAIT_TIMEOUT_MS: ${INCUS_OPERATION_WAIT_TIMEOUT_MS:-120000}
      VICTORIA_METRICS_URL: http://victoriametrics:8428
    volumes:
      # Copy config.example.yaml to config.yaml and set production secrets first.
      # Compose cannot chmod a host bind-mount; set host mode 0400 (see OPERATIONS.md).
      - ./config.yaml:/etc/nyabase/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=1770,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: ${BACKEND_CPUS:-4.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-512}
    networks:
      - edge
      - control-plane
      - telemetry
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health/ready')
          .then((response) => {
            if (!response.ok) process.exit(1);
          })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 1m

networks:
  edge:
  control-plane:
    internal: true
  telemetry:
    internal: true

volumes:
  postgres-data:
  vm-data:

