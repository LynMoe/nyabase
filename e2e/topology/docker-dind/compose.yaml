name: ${NYABASE_E2E_PROJECT}

x-e2e-labels: &e2e-labels
  io.nyabase.e2e.run-id: ${NYABASE_E2E_RUN_ID}
  io.nyabase.e2e.managed: "true"

x-backend-common: &backend-common
  image: ${NYABASE_E2E_BACKEND_IMAGE}
  labels: *e2e-labels
  environment:
    NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
    DATABASE_URL: "postgresql://nyabase:${NYABASE_E2E_RUN_ID}@postgres:5432/nyabase"
    REDIS_URL: "redis://:${NYABASE_E2E_RUN_ID}@redis:6379/0"
    REDIS_KEY_PREFIX: "nyabase:${NYABASE_E2E_RUN_ID}:"
    VICTORIA_METRICS_URL: http://victoriametrics:8428
    VMAGENT_URL: http://vmagent:8429
    NODE_OPTIONS: --require=/run/nyabase-e2e/backend-clock-shim.cjs
    NYABASE_E2E_CLOCK_OFFSET_MS: ${NYABASE_E2E_BACKEND_CLOCK_OFFSET_MS:-0}
  volumes:
    - ${NYABASE_E2E_RUNTIME_DIR}/backend-config:/etc/nyabase
    - ${NYABASE_E2E_ROOT}/e2e/orchestrator/backend-clock-shim.cjs:/run/nyabase-e2e/backend-clock-shim.cjs:ro
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - cluster

services:
  postgres:
    image: postgres:18.4-bookworm
    labels: *e2e-labels
    environment:
      POSTGRES_DB: nyabase
      POSTGRES_USER: nyabase
      POSTGRES_PASSWORD: ${NYABASE_E2E_RUN_ID}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nyabase -d nyabase -h 127.0.0.1']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_POSTGRES_IP}

  redis:
    image: redis:8.2-bookworm
    labels: *e2e-labels
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --save '' --appendonly no --maxmemory 256mb
        --maxmemory-policy allkeys-lfu --requirepass "${NYABASE_E2E_RUN_ID}"
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="${NYABASE_E2E_RUN_ID}" redis-cli -h 127.0.0.1 ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 2s
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_REDIS_IP}

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    labels: *e2e-labels
    command:
      - -retentionPeriod=1
      - -storageDataPath=/victoria-metrics-data
    volumes:
      - vm-data:/victoria-metrics-data
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1:8428/health]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 2s
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_VM_IP}

  vmagent:
    image: victoriametrics/vmagent:v1.148.0
    labels: *e2e-labels
    command:
      - -httpListenAddr=:8429
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -remoteWrite.tmpDataPath=/vmagent-data
      - -remoteWrite.maxDiskUsagePerURL=1GiB
    volumes:
      - vmagent-data:/vmagent-data
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1:8429/health]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 2s
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_VMAGENT_IP}

  backend-api:
    <<: *backend-common
    environment:
      NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
      NYABASE_RUNTIME_ROLE: api
      DATABASE_URL: "postgresql://nyabase:${NYABASE_E2E_RUN_ID}@postgres:5432/nyabase"
      DB_MIGRATIONS_RUN: "true"
      REDIS_URL: "redis://:${NYABASE_E2E_RUN_ID}@redis:6379/0"
      REDIS_KEY_PREFIX: "nyabase:${NYABASE_E2E_RUN_ID}:"
      VICTORIA_METRICS_URL: http://victoriametrics:8428
      VMAGENT_URL: http://vmagent:8429
      NODE_OPTIONS: --require=/run/nyabase-e2e/backend-clock-shim.cjs
      NYABASE_E2E_CLOCK_OFFSET_MS: ${NYABASE_E2E_BACKEND_CLOCK_OFFSET_MS:-0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_API_IP}

  backend-gateway:
    <<: *backend-common
    environment:
      NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
      NYABASE_RUNTIME_ROLE: gateway
      NYABASE_CONSOLE_PUBLIC_URL: "wss://localhost:${NYABASE_E2E_EDGE_PORT}/ws/console"
      DATABASE_URL: "postgresql://nyabase:${NYABASE_E2E_RUN_ID}@postgres:5432/nyabase"
      DB_MIGRATIONS_RUN: "true"
      REDIS_URL: "redis://:${NYABASE_E2E_RUN_ID}@redis:6379/0"
      REDIS_KEY_PREFIX: "nyabase:${NYABASE_E2E_RUN_ID}:"
      VICTORIA_METRICS_URL: http://victoriametrics:8428
      VMAGENT_URL: http://vmagent:8429
      NODE_OPTIONS: --require=/run/nyabase-e2e/backend-clock-shim.cjs
      NYABASE_E2E_CLOCK_OFFSET_MS: ${NYABASE_E2E_BACKEND_CLOCK_OFFSET_MS:-0}
    depends_on:
      backend-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ${NYABASE_E2E_RUNTIME_DIR}/backend-config/config.yaml:/etc/nyabase/config.yaml:ro
      - ${NYABASE_E2E_ROOT}/e2e/orchestrator/backend-clock-shim.cjs:/run/nyabase-e2e/backend-clock-shim.cjs:ro
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_GATEWAY_IP}

  backend-worker:
    <<: *backend-common
    environment:
      NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
      NYABASE_RUNTIME_ROLE: worker
      DATABASE_URL: "postgresql://nyabase:${NYABASE_E2E_RUN_ID}@postgres:5432/nyabase"
      DB_MIGRATIONS_RUN: "true"
      REDIS_URL: "redis://:${NYABASE_E2E_RUN_ID}@redis:6379/0"
      REDIS_KEY_PREFIX: "nyabase:${NYABASE_E2E_RUN_ID}:"
      VICTORIA_METRICS_URL: http://victoriametrics:8428
      VMAGENT_URL: http://vmagent:8429
      NODE_OPTIONS: --require=/run/nyabase-e2e/backend-clock-shim.cjs
      NYABASE_E2E_CLOCK_OFFSET_MS: ${NYABASE_E2E_BACKEND_CLOCK_OFFSET_MS:-0}
    depends_on:
      backend-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ${NYABASE_E2E_RUNTIME_DIR}/backend-config/config.yaml:/etc/nyabase/config.yaml:ro
      - ${NYABASE_E2E_ROOT}/e2e/orchestrator/backend-clock-shim.cjs:/run/nyabase-e2e/backend-clock-shim.cjs:ro
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_WORKER_IP}

  edge:
    image: nginx:1.27-alpine
    labels: *e2e-labels
    ports:
      - 127.0.0.1:${NYABASE_E2E_EDGE_PORT}:443
    volumes:
      - ${NYABASE_E2E_ROOT}/e2e/topology/docker-dind/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NYABASE_E2E_RUNTIME_DIR}/certs:/etc/nginx/tls:ro
    depends_on:
      - backend-api
      - backend-gateway
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_EDGE_IP}

  rate-limit-edge:
    image: nginx:1.27-alpine
    labels: *e2e-labels
    ports:
      - 127.0.0.1:${NYABASE_E2E_RATE_LIMIT_EDGE_PORT}:443
    volumes:
      - ${NYABASE_E2E_ROOT}/e2e/topology/docker-dind/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NYABASE_E2E_RUNTIME_DIR}/certs:/etc/nginx/tls:ro
    depends_on:
      - backend-api
      - backend-gateway
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_RATE_LIMIT_EDGE_IP}

  registry:
    image: registry:2.8.3
    labels: *e2e-labels
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /run/tls/registry.crt
      REGISTRY_HTTP_TLS_KEY: /run/tls/registry.key
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
      - ${NYABASE_E2E_RUNTIME_DIR}/certs:/run/tls:ro
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_REGISTRY_IP}

volumes:
  postgres-data:
    name: ${NYABASE_E2E_PREFIX}-postgres-data
    labels: *e2e-labels
  vm-data:
    name: ${NYABASE_E2E_PREFIX}-vm-data
    labels: *e2e-labels
  vmagent-data:
    name: ${NYABASE_E2E_PREFIX}-vmagent-data
    labels: *e2e-labels
  registry-data:
    name: ${NYABASE_E2E_PREFIX}-registry-data
    labels: *e2e-labels

networks:
  cluster:
    name: ${NYABASE_E2E_NETWORK}
    labels: *e2e-labels
    driver: bridge
    ipam:
      config:
        - subnet: ${NYABASE_E2E_SUBNET}
          gateway: ${NYABASE_E2E_GATEWAY}
