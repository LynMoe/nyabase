name: ${NYABASE_E2E_PROJECT}

x-e2e-labels: &e2e-labels
  io.nyabase.e2e.run-id: ${NYABASE_E2E_RUN_ID}
  io.nyabase.e2e.managed: "true"

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    labels: *e2e-labels
    command:
      - --retentionPeriod=1
      - --storageDataPath=/victoria-metrics-data
    volumes:
      - vm-data:/victoria-metrics-data
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_VM_IP}

  backend:
    image: ${NYABASE_E2E_BACKEND_IMAGE}
    labels: *e2e-labels
    environment:
      NYABASE_CONFIG_FILE: /etc/nyabase/config.yaml
      NODE_OPTIONS: --require=/run/nyabase-e2e/backend-clock-shim.cjs
      NYABASE_E2E_CLOCK_OFFSET_MS: ${NYABASE_E2E_BACKEND_CLOCK_OFFSET_MS:-0}
    volumes:
      - backend-data:/data
      # System settings persist through an atomic temporary-file rename. Bind
      # the private run directory, not the config file itself: Linux cannot
      # rename over a single-file bind mount (EBUSY), even when it is writable.
      - ${NYABASE_E2E_RUNTIME_DIR}/backend-config:/etc/nyabase
      - ${NYABASE_E2E_ROOT}/e2e/orchestrator/backend-clock-shim.cjs:/run/nyabase-e2e/backend-clock-shim.cjs:ro
    depends_on:
      - victoriametrics
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_BACKEND_IP}

  edge:
    image: nginx:1.27-alpine
    labels: *e2e-labels
    ports:
      - 127.0.0.1:${NYABASE_E2E_EDGE_PORT}:443
    volumes:
      - ${NYABASE_E2E_ROOT}/e2e/topology/docker-dind/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NYABASE_E2E_RUNTIME_DIR}/certs:/etc/nginx/tls:ro
    depends_on:
      - backend
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_EDGE_IP}

  rate-limit-edge:
    image: nginx:1.27-alpine
    labels: *e2e-labels
    ports:
      - 127.0.0.1:${NYABASE_E2E_RATE_LIMIT_EDGE_PORT}:443
    volumes:
      - ${NYABASE_E2E_ROOT}/e2e/topology/docker-dind/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NYABASE_E2E_RUNTIME_DIR}/certs:/etc/nginx/tls:ro
    depends_on:
      - backend
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_RATE_LIMIT_EDGE_IP}

  registry:
    image: registry:2.8.3
    labels: *e2e-labels
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /run/tls/registry.crt
      REGISTRY_HTTP_TLS_KEY: /run/tls/registry.key
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
      - ${NYABASE_E2E_RUNTIME_DIR}/certs:/run/tls:ro
    networks:
      cluster:
        ipv4_address: ${NYABASE_E2E_REGISTRY_IP}

volumes:
  backend-data:
    name: ${NYABASE_E2E_PREFIX}-backend-data
    labels: *e2e-labels
  vm-data:
    name: ${NYABASE_E2E_PREFIX}-vm-data
    labels: *e2e-labels
  registry-data:
    name: ${NYABASE_E2E_PREFIX}-registry-data
    labels: *e2e-labels

networks:
  cluster:
    name: ${NYABASE_E2E_NETWORK}
    labels: *e2e-labels
    driver: bridge
    ipam:
      config:
        - subnet: ${NYABASE_E2E_SUBNET}
          gateway: ${NYABASE_E2E_GATEWAY}
