{
  "name": "recovery",
  "description": "Isolated destructive CPU stack for restart, drift, retry, quarantine, and fail-stop cases.",
  "cpuOnly": true,
  "groups": [
    "00-foundation",
    "80-recovery-security",
    "90-cleanup-evidence"
  ],
  "requiredEnv": [
    "E2E_BASE_URL",
    "E2E_RUN_ID",
    "E2E_ADMIN_USERNAME",
    "E2E_ADMIN_PASSWORD",
    "E2E_EDGE_SPKI",
    "E2E_RESOURCE_MANIFEST",
    "E2E_RECOVERY_PROOF"
  ],
  "requiredCapabilities": [
    "fresh-control-plane",
    "tls-edge",
    "local-tls-registry",
    "two-cpu-nodes",
    "real-systemd",
    "agent-managed-dockerd",
    "cgroup-v2",
    "xfs-project-quota",
    "mount-namespaces",
    "network-namespaces",
    "shared-macvlan-l2",
    "fault-injection"
  ],
  "workers": 1,
  "timeoutMs": 180000
}
