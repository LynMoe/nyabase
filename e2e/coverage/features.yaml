          "caseId": "recovery.security.redis-disposable-outage-recovery",
          "title": "Redis loss, flush, and restart preserve authorization and durable dispatch",
          "kind": "behavioral",
          "status": "implemented",
          "profiles": [
            "recovery"
          ],
          "persona": "release-engineer-and-adversarial-client",
          "assertions": [
            "an administrator can authenticate and a physical ContainerCreate dispatch reaches a terminal PostgreSQL task while Redis is stopped",
            "the split API readiness endpoint fails with REDIS_NOT_READY during the outage and returns 200 only after Redis reconnects",
            "API-to-socket-owner self-check, restart pre-inspection, and Console admission fail within a bounded deadline while Redis routing is unavailable, without creating a task or mutating the durable/physical runtime",
            "after Redis recovery the same self-check, exact restart task/result, and real Console marker succeed through the socket owner",
            "flushing Redis does not revoke current PostgreSQL authority and a later ContainerStop dispatch is observable through PostgreSQL polling",
            "after an independent Redis restart a fresh login and ContainerStart dispatch restore the same physical runtime"
          ],
          "specTestIds": [
            "recovery.redis.disposable-outage-recovers-authorization-dispatch"
          ],
          "httpSurfaces": []
        },
