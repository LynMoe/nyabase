          "persona": "release-engineer-and-adversarial-client",
          "assertions": [
            "a run-owned current-build secondary Gateway becomes the durable higher-generation Agent owner while the original primary Gateway process is paused and the selected real Agent connection is cut",
            "an A-bound long-running Console established before takeover is closed after B becomes authoritative, its PostgreSQL exec session is durably closed, follow-up browser input is rejected, and its forbidden marker is absent from B Console output",
            "after that exact primary process is unpaused and releases delayed close/cleanup work, the secondary session remains Online and owns API self-check, restart inspection/task result, and a real Console input/output/clean-close flow whose API consoleUrl and actual browser WebSocket both use the manifest-owned secondary TLS edge rather than the primary edge",
            "a separate long-running B Console is closed by the browser after output, PostgreSQL records that exact exec session closed, and an independent B Console proves the Agent physical exec process was terminated rather than naturally exiting",
            "after delayed primary cleanup is released, an SSH command and an HTTP marker request traverse the retained B-owned routes while both proxy clients retain non-regressing snapshot generations",
            "provider restore removes the exact Agent route, labelled secondary containers, and secondary host listener while retiring their manifest identities, then proves a newer primary session without changing physical runtime identity"
          ],
          "specTestIds": [
            "recovery.agent.split-gateway-takeover-fences-stale-owner"
          ],
