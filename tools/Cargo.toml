[workspace]
resolver = "2"
members = ["proxy-common", "ssh-proxy", "http-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.23"
futures-util = "0.3"
libc = "0.2"
pretty_assertions = "1"
russh = { version = "0.65", features = ["ring"] }
russh-sftp = "3"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
proxy-common = { path = "proxy-common" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
