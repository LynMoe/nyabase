[package]
name = "nyabase-mount-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nyabase-mount-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "mount", "sched"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
