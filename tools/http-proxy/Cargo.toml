[package]
name = "nyabase-http-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nyabase-http-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
