name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NYABASE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency security gate
        run: pnpm audit --prod --audit-level=high
      - name: Build and test
        run: pnpm check
      - name: Typecheck live e2e suite and orchestrator contracts
        run: pnpm e2e:check
      - name: Verify PostgreSQL operations fail-closed contracts
        run: bash scripts/postgres-ops.test.sh
      - name: Verify PostgreSQL fresh-only restore against PostgreSQL 18
        run: bash scripts/postgres-ops.integration.test.sh
      - name: Verify deployment hardening contracts
        run: bash scripts/deploy-contract.test.sh
      - name: Build production container
        run: docker build --tag nyabase-backend:ci -f deploy/Dockerfile.backend .
      - name: Verify production container identity
        run: test "$(docker image inspect nyabase-backend:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Boot production Compose topology
        run: bash scripts/production-compose-smoke.sh
