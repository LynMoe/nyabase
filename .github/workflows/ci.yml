name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NYABASE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-node's pnpm cache runs `pnpm store path`, so pnpm must exist first.
      # The version comes from package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install ripgrep for the source assertions
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency security gate
        run: pnpm audit --prod --audit-level=high
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2
      # Ignored advisories, with the reason for each, live in tools/.cargo/audit.toml.
      - name: Rust dependency security gate
        working-directory: tools
        run: cargo audit
      - name: Build and test
        run: pnpm check
      - name: Typecheck live e2e suite, check scripts, load scenarios
        run: pnpm e2e:check
      - name: Verify PostgreSQL fresh-only restore against PostgreSQL 18
        run: bash scripts/postgres-ops.integration.test.sh
      - name: Build production container
        run: docker build --tag nyabase-backend:ci -f deploy/Dockerfile.backend .
      - name: Verify production container identity
        run: test "$(docker image inspect nyabase-backend:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Boot production Compose topology
        run: bash scripts/production-compose-smoke.sh
