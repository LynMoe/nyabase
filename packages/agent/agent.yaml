# Example agent.yaml. The schema is enforced by `zAgentConfig` in src/config.ts;
# unknown fields are silently ignored.
#
# Note: there is intentionally no `dockerSocket` / `xfsMount` / `overlayMount` /
# `dataDisks` field. The agent always talks to its own nyabase-managed dockerd
# at a fixed UNIX socket (see DaemonManager.SOCKET_PATH) and the XFS mount is
# derived from `dockerRoot`. Data disks are now managed by the backend.

backendUrl: ws://localhost:3001/ws/agent
