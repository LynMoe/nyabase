serverId: "37d69a7a-b799-41a9-8bcc-493ae67dd259"
dockerRoot: /var/lib/nyabase-docker
parentIface: eth0
macvlanCidr: 192.168.100.0/24
macvlanGateway: 192.168.100.1
metricsIntervalMs: 10000
isGpuServer: true
