# Example agent.yaml. The schema is enforced by `zAgentConfig` in src/config.ts;
# unknown and retired fields are rejected.
#
# Note: there is intentionally no `dockerSocket` / `xfsMount` / `overlayMount`
# field. The agent always talks to its own nyabase-managed dockerd at a fixed
# UNIX socket (see DaemonManager.SOCKET_PATH).
#
# Local data source roots are owned by this file: `localDataSources[].mountPoint`
# declares the host root for user data. The backend only creates/deletes data
# directories under those roots; it never creates, edits, or deletes the roots
# themselves.

backendUrl: ws://localhost:3001/ws/agent
agentToken: "REPLACE_WITH_AGENT_TOKEN_FROM_BACKEND"
serverId: "REPLACE_WITH_SERVER_ID_FROM_BACKEND"
dockerRoot: /var/lib/nyabase-docker
parentIface: eth0
macvlanCidr: 192.168.100.0/24
macvlanGateway: 192.168.100.1
reservedIps: []
metricsIntervalMs: 10000
isGpuServer: true
localDataSources:
  - id: local-main
    mountPoint: /data/nyabase
    label: Main local data

# Optional host-level guardrail for the nyabase-managed Docker daemon.
# When enabled, Docker containers are placed under a systemd slice that:
# - does not limit CPU on hosts with fewer than 12 logical cores;
# - reserves floor(cpuCores / 12) logical cores on larger hosts;
# - reserves min(10% host memory, 64GiB) for the host.
dockerResourceLimit:
  enabled: false
